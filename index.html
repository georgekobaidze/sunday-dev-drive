<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday DEV Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #000015 0%, #00000e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; gap: 24px;
    }
    #overlay h1 {
      font-size: 2.8rem; font-weight: bold; letter-spacing: 0.12em;
      color: #00aaff;
      text-shadow: 0 0 20px #00aaff, 0 0 40px #0055ff;
    }
    #overlay p { color: #bf80ff; font-size: 1rem; letter-spacing: 0.08em; }
    #overlay input {
      background: #0a0018; border: 2px solid #00aaff; color: #fff;
      padding: 12px 20px; font-size: 1.1rem; font-family: inherit;
      border-radius: 4px; outline: none; width: 320px; text-align: center;
      box-shadow: 0 0 12px #00aaff55;
    }
    #overlay input:focus { border-color: #00ffe1; box-shadow: 0 0 18px #00ffe155; }
    #overlay button {
      background: transparent; border: 2px solid #ff2d78; color: #ff2d78;
      padding: 12px 36px; font-size: 1rem; font-family: inherit;
      border-radius: 4px; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; transition: all 0.2s;
      box-shadow: 0 0 10px #ff2d7855;
    }
    #overlay button:hover { background: #ff2d7822; box-shadow: 0 0 20px #ff2d78; }
    #test-drive-btn {
      background: transparent; border: 2px solid #00ff88; color: #00ff88;
      padding: 10px 24px; font-size: 0.82rem; font-family: inherit;
      border-radius: 4px; cursor: pointer; letter-spacing: 0.08em;
      text-transform: uppercase; transition: all 0.2s;
      box-shadow: 0 0 8px #00ff8844; margin-top: -8px;
    }
    #test-drive-btn:hover { background: #00ff8818; box-shadow: 0 0 18px #00ff88; }
    #overlay-error  { color: #ff4444; font-size: 0.85rem; min-height: 1.2em; }
    #exit-btn {
      position: fixed; bottom: 20px; left: 20px; z-index: 50;
      background: transparent; border: 2px solid #ff2d78; color: #ff2d78;
      padding: 8px 18px; font-size: 0.8rem; font-family: 'Courier New', monospace;
      border-radius: 4px; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; transition: all 0.2s;
      box-shadow: 0 0 8px #ff2d7855; display: none;
    }
    #exit-btn:hover { background: #ff2d7822; box-shadow: 0 0 16px #ff2d78; }
    #share-btn {
      position: fixed; bottom: 20px; left: 100px; z-index: 50;
      background: transparent; border: 2px solid #00ffe1; color: #00ffe1;
      padding: 8px 18px; font-size: 0.8rem; font-family: 'Courier New', monospace;
      border-radius: 4px; cursor: pointer; letter-spacing: 0.1em;
      text-transform: uppercase; transition: all 0.2s;
      box-shadow: 0 0 8px #00ffe155; display: none;
    }
    #share-btn:hover { background: #00ffe122; box-shadow: 0 0 16px #00ffe1; }
    #share-btn.copied { border-color: #00ff88; color: #00ff88; box-shadow: 0 0 16px #00ff88; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>SUNDAY DEV DRIVE</h1>
    <p>Drive through your DEV.to articles</p>
    <input id="username-input" type="text" placeholder="your dev.to username" autocomplete="off" spellcheck="false" />
    <button id="start-btn">START DRIVING</button>
    <button id="test-drive-btn">No DEV account? Take a test drive →</button>
    <div id="overlay-status"></div>
    <div id="overlay-error"></div>
  </div>

  <button id="exit-btn">EXIT</button>
  <button id="share-btn">SHARE JOURNEY</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>

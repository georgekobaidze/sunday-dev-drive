<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunday DEV Drive</title>
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="overlay">
    <h1>DRIVE THROUGH YOUR DEV COMMUNITY ARTICLES</h1>
    <input id="username-input" type="text" placeholder="your dev.to username" autocomplete="off" spellcheck="false" />
    <button id="start-btn">START DRIVING</button>
    <button id="test-drive-btn">No DEV account?<br>Take a test drive →</button>
    <div id="overlay-status"></div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="overlay-error"></div>
  </div>

  <button id="exit-btn">EXIT</button>
  <button id="share-btn">SHARE JOURNEY</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
